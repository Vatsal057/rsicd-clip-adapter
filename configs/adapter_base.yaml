# Main adapter experiment configuration.
# All numeric defaults match IMPLEMENTATION.md.

model:
  clip_model_name: "ViT-B-32"
  clip_pretrained:  "openai"
  hidden_dim:       256           # Adapter bottleneck dimension
  dropout:          0.1
  adapter_on_image: true
  adapter_on_text:  true
  use_residual:     true
  learn_logit_scale: true

training:
  batch_size:       64
  num_epochs:       20
  learning_rate:    1.0e-4
  weight_decay:     1.0e-4
  warmup_epochs:    2             # Linear LR warmup over the first N epochs
  grad_clip_norm:   1.0           # Gradient clipping
  seed:             42
  num_workers:      4

data:
  splits_dir:   "data/splits"
  images_dir:   "data/raw/RSICD_images"

paths:
  checkpoint_dir: "results/checkpoints"
  metrics_dir:    "results/metrics"
  log_every:      50             # Print loss every N optimizer steps
  eval_every:     1              # Evaluate on val every N epochs
  save_best_name: "adapter_best.pt"

eval:
  image_batch_size:   64
  caption_batch_size: 256
